[package]
name         = "emobtest-native"
# Held to the workspace's version by `tests/test_version.py`: the wheel and the
# crates it binds never disagree.
version      = "0.6.1"
edition      = "2024"
rust-version = "1.96"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/emob"
description  = "PyO3 bindings behind the emobtest Python toolkit: an OCPP station, emob's meter, verifier, Eichrecht check, tariff rating, identifiers and event schemas"
publish      = false

# Not a member of the emob workspace: PyO3 needs a Python to build against, and
# `just ci` must not. `just emobtest` builds and tests it.
[workspace]

[lib]
# `cdylib` is what maturin packages; `rlib` keeps the logic unit-testable.
name       = "emobtest_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
emob-core      = { path = "../crates/emob-core" }
emob-eichrecht = { path = "../crates/emob-eichrecht" }
emob-sim       = { path = "../crates/emob-sim" }
emob-tariff    = { path = "../crates/emob-tariff" }
emob-verify    = { path = "../crates/emob-verify" }
datex2         = "0.3"
hex            = "0.4"
jsonschema     = { version = "0.61", default-features = false }
rust_decimal   = { version = "1", features = ["serde-with-str"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
time           = { version = "0.3", features = ["parsing", "formatting"] }
# The station: `ocpp-kit`'s wallbox and vehicle for the physics and the
# protocol, its station transport for the wire.
ocpp-kit       = { version = "0.8", default-features = false, features = ["std", "tokio", "station", "testkit", "rustls", "v1_6", "v2_0_1", "v2_1"] }
tokio          = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "net"] }
base64         = "0.23"

# `pyo3/extension-module` is not a feature here: maturin enables it, and
# declaring it would break `cargo test`'s link against libpython.
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[profile.release]
opt-level = 3
lto       = "thin"
strip     = "debuginfo"
