[package]
name        = "billd"
description = "The service that closes a month: it decides when an invoice is issued, what number it carries, which one it supersedes, and which account each posting lands in — and never what a document says"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
emob-billing = { workspace = true }
emob-cdr     = { workspace = true }
emob-core    = { workspace = true }
emob-service = { workspace = true }

# The journal. **The only manifest in this workspace that may declare it**: it
# takes `uuid`/`v7`, and therefore a clock, so no crate promising replay may
# carry it in its graph — which `cargo xtask check-graph` enforces (D181).
doubleentry  = { workspace = true }

emob-tariff  = { workspace = true }
# The invoice page's token (spec 010): HMAC-SHA256 under a key from the OS
# CSPRNG, the receipt's construction (SR-116).
base64       = { workspace = true }
getrandom    = "0.4"
hmac         = { workspace = true }
sha2         = { workspace = true }
# The client half of the invoice delivery (SR-119). Already in the graph
# through csmsd and roamd; `json` only.
reqwest      = { version = "0.13", default-features = false, features = ["json"] }
anyhow       = { workspace = true }
axum         = { workspace = true }
serde_json   = { workspace = true }
serde        = { workspace = true }
rust_decimal = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing      = { workspace = true }

[dev-dependencies]
# The consumer side of the invoice files (spec 010): read back and validated.
en16931        = { workspace = true }
en16931-formats = { workspace = true }
emob-eichrecht = { workspace = true }
emob-session   = { workspace = true }
hex            = { workspace = true }
ocmf           = { workspace = true }
p256           = { workspace = true }
time           = { workspace = true, features = ["macros"] }
