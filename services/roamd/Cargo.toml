[package]
name        = "roamd"
description = "The roaming node: it decides who a record goes to, when it is late, and what to do with one that arrives — and never what a record says"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
emob-cdr     = { workspace = true }
emob-core    = { workspace = true }
emob-poi     = { workspace = true }
emob-roam    = { workspace = true }
# `policy` because this is the daemon the feature exists for: a partner is
# onboarded while the node runs, and what an operator wants to say about one is
# not a set of dotted capability patterns. No other daemon turns it on, and the
# hundred and eight crates behind it stay out of their graphs.
emob-service = { workspace = true, features = ["policy"] }
emob-tariff  = { workspace = true }

# The sockets, both ways: `client` pushes a record to a peer, `server` is the
# credentials module `[OCPI 2.3.0]` makes mandatory and the CDRs receiver. No
# document is built here — every one of them is `emob-roam`'s.
ocpi-kit     = { workspace = true, features = ["client", "server"] }
oicp-kit     = { workspace = true }

anyhow       = { workspace = true }
# A credentials token nobody can guess. Already in the graph (through the
# kit's TLS stack); the one call is `getrandom::fill`.
getrandom    = "0.4"
hex          = { workspace = true }
axum         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
# The HTTP method and header types, which `ocpi-kit` takes in its own signatures.
# Version-pinned here rather than in the workspace because this is the only
# crate that names them.
http         = "1"
thiserror    = { workspace = true }
time         = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing      = { workspace = true }

[dev-dependencies]
ocpi-kit      = { workspace = true, features = ["client", "server", "testkit"] }
tokio         = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
serde_json    = { workspace = true }
emob-eichrecht = { workspace = true }
emob-poi       = { workspace = true }
emob-session   = { workspace = true }
hex            = { workspace = true }
ocmf           = { workspace = true }
p256           = { workspace = true }
rust_decimal   = { workspace = true }
sha2           = { workspace = true }
time           = { workspace = true, features = ["macros"] }
