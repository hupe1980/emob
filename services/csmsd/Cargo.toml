[package]
name       = "csmsd"
publish    = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description = "The CSMS daemon: an OCPP 1.6J/2.0.1/2.1 endpoint whose transaction events reach the Eichrecht chain, with the seam rule enforced by the types it is allowed to see"

[dependencies]
emob-cdr       = { workspace = true }
emob-core      = { workspace = true }
emob-eichrecht = { workspace = true }
ocmf           = { workspace = true }
emob-ocpp      = { workspace = true }
emob-roam      = { workspace = true }
emob-session   = { workspace = true }
emob-service   = { workspace = true, features = ["webhook-client"] }
emob-tariff    = { workspace = true }
# The check a driver runs, compiled in twice: natively to label the signed
# values, and as the WebAssembly module the receipt serves (spec 003).
emob-verify    = { path = "../../crates/emob-verify" }
ocpp-kit       = { workspace = true, features = ["std", "tokio", "csms", "rustls", "v1_6", "v2_0_1", "v2_1"] }
# Station passwords are Argon2id hashes in the estate (spec 005).
argon2         = { workspace = true }
# The salt for `csmsd hash-password`, from the RNG `rustls` already links.
aws-lc-rs      = { workspace = true }
anyhow         = { workspace = true }
# The receipt token: HMAC-SHA256 under a key from the OS CSPRNG (SR-060).
base64         = { workspace = true }
getrandom      = "0.4"
hex            = { workspace = true }
hmac           = { workspace = true }
sha2           = { workspace = true }
axum           = { workspace = true }
# The client half of the deliveries and the authorise call. Already in the
# graph through `ocpi-kit`'s `client` (roamd); `json` only, so it adds no crate.
reqwest        = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust_decimal   = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
time           = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing        = { workspace = true }

[dev-dependencies]
# The published event schemas, held to what is sent (spec 012).
jsonschema     = { workspace = true }
tower-service      = "0.3"
tracing-subscriber = { workspace = true }
# The estate, started in-process: the three daemons a settled session reaches.
billd          = { path = "../billd" }
empd           = { path = "../empd" }
roamd          = { path = "../roamd" }
emob-sim       = { workspace = true }
ocpp-kit       = { workspace = true, features = ["std", "tokio", "csms", "station", "testkit", "rustls", "v1_6", "v2_0_1", "v2_1"] }
# Reading a fixture certificate's DER in a unit test.
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ocpi-kit       = { workspace = true, features = ["client", "server", "testkit"] }
tokio          = { version = "1.45", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
