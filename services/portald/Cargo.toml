[package]
name = "portald"
description = "Customer access to charging agreements, receipts and issued invoices"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["form"] }
base64 = { workspace = true }
emob-core = { workspace = true, features = ["serde"] }
emob-service = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["form"] }
