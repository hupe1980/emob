[[extra.faq]]
q = "How do I try emob?"
a = "Run just demo in the checkout. It starts seven services, three simulated charging stations and a local OCPI peer. The printed links open Heute, the driver receipt and a customer portal with an issued invoice."
[[extra.faq]]
q = "How can a driver check a charge?"
a = "The receipt shows energy, price lines and the meter key. Drivers can verify signed OCMF readings in the browser or download the transparency file for S.A.F.E. Transparenzsoftware."
[[extra.faq]]
q = "What can an operator do in Heute?"
a = "Investigate refused sessions, manage stations and reservations, issue or replace driver cards, grant customer access and review monthly invoices. Finance staff can import a statement and allocate payments."
[[extra.faq]]
q = "Which interfaces are available?"
a = "The CSMS accepts OCPP 1.6J, 2.0.1 and 2.1. The estate exchanges OCPI records, publishes DATEX II charging data and produces EN 16931 invoices. Rust libraries also provide OICP conversion, SEPA files and ISO 15118 certificate validation."
[[extra.faq]]
q = "What deployment has been tested?"
a = "Acceptance runs use a single-host estate, simulated stations and local recipients. External connections and physical charging equipment require installation-specific checks."
