base_url = "https://hupe1980.github.io/emob"
title = "emob"
description = "The open-source e-mobility operating stack: CPO and EMP in one Rust workspace. OCMF signed meter values verified end to end, a quarter-hour split that conserves energy exactly, one tariff that reaches the driver, the roaming partner and the national access point as one number, AFIR and Eichrecht as executable cited rules, and no binary float anywhere near the money."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
smart_punctuation = true
# Deep links to every heading: a documentation page whose sections cannot be
# linked to is one nobody links to.
insert_anchor_links = "heading"

[extra]
repository = "https://github.com/hupe1980/emob"
tagline    = "open-source charging operations for the European market"
# The landing page's five numbers. They live here rather than in the template so
# that changing one is a one-line diff against the thing that produced it:
#
#   stat_obligations  emob_core::obligation::CALENDAR — `.len()`
#   stat_tests        cargo test --workspace --all-features
#   stat_crates       the publishable crates under crates/
#   stat_floats       cargo xtask no-floats
#   stat_curves       emob_eichrecht::ocmf::verify::KeyType
#
# A number here that no longer matches its source is worse than no number.
stat_obligations = "40"
stat_tests       = "662"
stat_crates      = "9"
stat_floats      = "0"
stat_curves      = "4"

keywords = "EV charging, CPO, EMP, eMSP, CSMS, OCPP 2.1, OCPI 2.3.0, OICP, ISO 15118, OCMF, Eichrecht, AFIR, NIS2, Cyber Resilience Act, DATEX II, Plug and Charge, roaming, CDR, Rust, charging station management"
