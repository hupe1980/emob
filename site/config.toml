base_url = "https://hupe1980.github.io/emob"
title = "emob"
description = "Open-source EV charging operations for Europe — CPO and eMSP in one Rust workspace. Signed meter values, exact settlement, AFIR and Eichrecht as code."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
smart_punctuation = true
# Deep links to every heading: a documentation page whose sections cannot be
# linked to is one nobody links to.
insert_anchor_links = "heading"

[extra]
repository = "https://github.com/hupe1980/emob"
tagline    = "open-source charging operations for the European market"
msrv       = "1.94"
# The landing page's five numbers. They live here rather than in the template so
# that changing one is a one-line diff against the thing that produced it — and
# `cargo xtask check-concepts` now holds the first three against their sources,
# because the comment below was true, unenforced, and wrong in three of five
# places for four milestones (D288):
#
#   stat_obligations  emob_core::obligation::CALENDAR — one entry per `id:`
#   stat_tests        cargo test --workspace --all-features
#   stat_crates       the publishable crates under crates/
#   stat_floats       cargo xtask no-floats
#   stat_curves       the ECDSA curves the pure-Rust build verifies
#
# A number here that no longer matches its source is worse than no number.
stat_obligations = "47"
stat_tests       = "913"
stat_crates      = "12"
stat_floats      = "0"
stat_curves      = "4"

keywords = "EV charging, CPO, EMP, eMSP, CSMS, OCPP 2.1, OCPI 2.3.0, OICP, ISO 15118, OCMF, Eichrecht, AFIR, NIS2, Cyber Resilience Act, DATEX II, Plug and Charge, roaming, CDR, Rust, charging station management"
