# cargo-deny — licences and advisories.
#
# Run with `just deny` or `cargo deny check`. CI runs it on every push and pull
# request, and the release re-runs it on the tagged commit. There is no
# scheduled run: an advisory filed against an unchanged `main` surfaces on the
# next change or the next release, whichever comes first.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" }, # the static build for a site controller
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
# Permissive only. A copyleft dependency in a crate an operator links into their
# own charging platform is a decision for them to take deliberately, not one to
# inherit from us.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MIT-0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9

# The Mozilla root store as data, under the Community Data License Agreement
# (permissive, no copyleft). Pulled by ocpp-kit's `rustls` feature, which csmsd
# enables for security profiles 2 and 3 (spec 005); csmsd itself never trusts
# these roots — stations are verified against the estate's own `client_ca`.
# Scoped to the one crate rather than allowed workspace-wide.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
# A second major version of a numeric or serialisation crate is how two halves
# of the workspace come to disagree about what a number is — and in this
# workspace a number is money. Any new duplicate needs an entry here with a
# reason.
multiple-versions = "warn"
wildcards = "deny"
# A path dependency of a crate that is never published (a daemon's in-process
# end-to-end tests start the other daemons) is not a version anybody resolves.
# A publishable crate still names a version beside its path.
allow-wildcard-paths = true

[[bans.deny]]
# The workspace promise is exact decimal arithmetic end to end. A crate whose
# whole purpose is approximate decimal formatting has no business in the
# dependency graph of an invoice.
name = "float-cmp"

[advisories]
yanked = "deny"
# An ignored advisory is a decision, not a silence: each entry names the
# exposure analysis, the upstream it waits on, and the date it is looked at
# again. The reasoning in full is D334 in the decision log.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing variability, via elliptic-curve 0.13 <- p256/k256/p384/p192 0.13, the RustCrypto generation the ocmf crate pins and this workspace matches so the simulator signs with the code ocmf verifies with (D304). Exposure: emob verifies over public keys and public signatures, where a timing channel has no secret to leak; only emob-sim and test fixtures sign, with throwaway keys. Upstream: ocmf moving to the 0.14 curve generation, requested in our ocmf feedback (2026-11-18). Review 2027-03-01." },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (no known vulnerability), via cedar-policy, agentd's policy engine (D300); emob's own time types are time and jiff. Exposure: none beyond an unmaintained parser of policy-file dates the operator writes. Upstream: cedar-policy moving off chrono. Review 2027-03-01." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
