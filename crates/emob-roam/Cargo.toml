[package]
name        = "emob-roam"
description = "The roaming edge: one canonical charge detail record carried onto OCPI 2.3.0/2.2.1 and OICP 2.3, each with an explicit account of what the crossing cost, routed to the partner the contract identifier itself names"
keywords    = ["ev-charging", "ocpi", "oicp", "roaming", "cdr"]
categories  = ["api-bindings", "data-structures"]
readme      = "README.md"

version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true

# **Not** `workspace = true`, and the exception is the point. Every other crate
# here promises 1.94 — the floor the sibling workspaces carry, and the one the
# crates that decide money keep, so `mako` and `hems` can consume them. This one
# speaks to `ocpi-kit`, which declares 1.96, and a roaming edge is not something
# either sibling consumes. Raising the shared floor to take one dependency would
# make every downstream pay for a wire they do not use.
rust-version = "1.96"

# `ocpi-kit` is not optional. Unlike the crates that decide money — which build
# with no protocol implementation anywhere in their tree — this crate *is* the
# seam onto a wire, and a build of it without that wire would have nothing to
# translate.
#
# `emob-poi` is here for one reason, and it is the same reason that crate exists
# at all: the location a partner's CDR names and the location the national
# access point publishes are one object. A CPO whose OCPI Locations module and
# whose Mobilithek feed disagree about a connector is the industry norm, and it
# is only possible where the two are generated from two inventories.
[dependencies]
emob-cdr     = { workspace = true }
emob-core    = { workspace = true }
emob-poi     = { workspace = true }
emob-session = { workspace = true }
emob-tariff  = { workspace = true }

ocpi-kit = { workspace = true }
# The other wire, and the reason the module beside `ocpi` exists rather than a
# generic one: OICP is hub-and-spoke, its CDR carries **no money at all**, and
# the price crosses separately as a pricing *product* the two parties agreed on.
# A translation layer that abstracted over the two would have to invent a total
# for one of them.
oicp-kit = { workspace = true }

rust_decimal = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }

[dev-dependencies]
ocmf           = { workspace = true }
emob-eichrecht = { workspace = true }
# Dev only, and only for `tests/the_same_session_over_oicp.rs`: `MockHubject` is
# the broker in a process, so the sequence a real integration would find weeks
# later — a CDR for a session the broker never opened — is a unit test. It is a
# dev-dependency because a domain crate has no business holding a broker, and
# `testkit` reaches `transport`, which is `http`'s types and no socket.
oicp-kit       = { workspace = true, features = ["testkit"] }
# Dev only, and only for `tests/one_price_three_audiences.rs`: the claim that
# one tariff reaches the driver, the partner and the national access point as
# one number cannot be checked from inside any one of the three crates that
# carry it.
emob-ocpp      = { workspace = true }
# Dev only, and only for `tests/the_other_hat.rs`: the EMP half of the platform
# is a partner's record re-rated at this side's retail price and invoiced to a
# driver, and that composition spans four crates. No one of them can assert it.
emob-billing   = { workspace = true }
hex            = { workspace = true }
p256           = { workspace = true }
serde_json     = { workspace = true }
sha2           = { workspace = true }
time           = { workspace = true, features = ["macros"] }
