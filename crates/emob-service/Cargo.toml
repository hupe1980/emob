[package]
name        = "emob-service"
description = "The shell every emob daemon shares — configuration, structured logging, a readiness probe that does not lie, graceful shutdown — and the three pieces that are about charging: an OCPI-party authority model, the CloudEvents catalogue, and one webhook signature"
keywords    = ["ev-charging", "ocpi", "cloudevents", "webhooks", "daemon"]
categories  = ["web-programming", "api-bindings"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
emob-core = { workspace = true }

axum               = { workspace = true }
base64             = { workspace = true }
hmac               = { workspace = true }
serde              = { workspace = true, optional = true }
sha2               = { workspace = true }
subtle             = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true }
tokio              = { workspace = true, features = ["rt", "macros", "net", "signal", "time"] }
tokio-util         = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize the types a daemon persists or forwards.
serde = ["dep:serde", "emob-core/serde", "time/serde-well-known"]

[dev-dependencies]
tokio         = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tower-service = "0.3"
