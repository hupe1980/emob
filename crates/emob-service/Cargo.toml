[package]
name        = "emob-service"
description = "The shell every emob daemon shares — configuration, structured logging, a readiness probe that does not lie, graceful shutdown — and the three pieces that are about charging: an OCPI-party authority model, the CloudEvents catalogue, and one webhook signature"
keywords    = ["ev-charging", "ocpi", "cloudevents", "webhooks", "daemon"]
categories  = ["web-programming", "api-bindings"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
emob-core = { workspace = true }
# The estate's tariffs become the one tariff object `csmsd` rates with and
# `tarifd` publishes — built in one place, so the two cannot drift.
emob-tariff = { workspace = true, optional = true }

# The policy engine, **off by default**. See the workspace manifest: it is a
# hundred and eight crates, and a daemon that decides authorisation from a typed
# value should not carry them.
cedar-policy = { workspace = true, optional = true }

# The estate's JSON Schema (spec 012), off by default: only `emob check` and
# the schema test need it.
schemars = { workspace = true, optional = true }

aws-lc-rs          = { workspace = true }
axum               = { workspace = true }
base64             = { workspace = true }
hex                = { workspace = true }
hmac               = { workspace = true }
reqwest            = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
standardwebhooks   = "1.3"
url                = "2"
rust_decimal       = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true, optional = true, features = ["raw_value"] }
sha2               = { workspace = true }
subtle             = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true }
tokio              = { workspace = true, features = ["rt", "macros", "net", "signal", "time"] }
tokio-util         = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["serde"]
## Send signed CloudEvents over HTTP.
webhook-client = ["dep:reqwest", "serde"]
## Serialize/deserialize the types a daemon persists or forwards.
serde = ["dep:serde_json", "dep:emob-tariff", "emob-core/serde", "emob-tariff/serde", "time/serde-well-known"]
## Operator-authored Cedar policies over the authority model's own entity types.
policy = ["dep:cedar-policy"]
## The estate's JSON Schema, derived from the section types.
schema = ["serde", "dep:schemars"]

[dev-dependencies]
serde_json    = { workspace = true }
tokio         = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tower-service = "0.3"
