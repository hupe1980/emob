[package]
name        = "emob-eichrecht"
description = "German calibration law for EV charging: OCMF signed meter values parsed without destroying the signed bytes, ECDSA-verified, chain-validated, and billable only when every check holds"
keywords    = ["ocmf", "eichrecht", "ev-charging", "metering", "ecdsa"]
categories  = ["cryptography", "parser-implementations"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
emob-core    = { workspace = true }
base64       = { workspace = true }
hex          = { workspace = true }
k256         = { workspace = true }
p192         = { workspace = true }
p256         = { workspace = true }
p384         = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true, optional = true }
serde_json   = { workspace = true }
sha2         = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize the parsed payload types.
serde = ["dep:serde", "emob-core/serde", "rust_decimal/serde", "time/serde-well-known"]

[dev-dependencies]
serde_json = { workspace = true }
