[package]
name        = "emob-cli"
publish     = false
description = "Run the standalone charging demo, validate an estate, verify meter records and witness signed journals."
keywords    = ["ocmf", "eichrecht", "cli", "verification", "ev-charging"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[[bin]]
name = "emob"
path = "src/main.rs"
# `verify` is tested from outside, as a driver runs it (`tests/`); the demo's
# guards (SR-070..SR-077) are unit tests beside the code they hold.

[dependencies]
emob-eichrecht = { workspace = true }
emob-verify    = { path = "../emob-verify" }
# `emob qr`: the price page's code for print. Only the encoder; the SVG is drawn
# here, so no image library comes with it.
qrcode         = { version = "0.14", default-features = false }
# `emob check-feed`: any DATEX II AFIR file read, and held to the Mobilithek
# profile by the writer `poid` publishes with (spec 016).
datex2         = { workspace = true }

# `emob demo`: the estate's own daemons, started through the `daemon::run` each
# `main` is a configuration shim over, with the kits' station and partner as
# the counterparties. Every crate below is already in the workspace's graph.
billd          = { path = "../../services/billd" }
csmsd          = { path = "../../services/csmsd" }
accountingd    = { path = "../../services/accountingd" }
portald        = { path = "../../services/portald" }
deskd          = { path = "../../services/deskd" }
empd           = { path = "../../services/empd" }
roamd          = { path = "../../services/roamd" }
poid           = { path = "../../services/poid" }
tarifd         = { path = "../../services/tarifd" }
emob-core      = { workspace = true }
emob-roam      = { workspace = true }
emob-ocpp      = { workspace = true }
emob-service   = { workspace = true, features = ["schema", "webhook-client"] }
emob-sim       = { workspace = true }
ocpp-kit       = { workspace = true, features = ["std", "tokio", "station", "rustls", "v1_6", "v2_0_1", "v2_1"] }
ocpi-kit       = { workspace = true, features = ["client", "server", "testkit"] }
# `demo --check` reads the invoice files back and validates them (spec 010).
en16931        = { workspace = true }
en16931-formats = { workspace = true }
reqwest        = { version = "0.13", default-features = false, features = ["rustls"] }
anyhow         = { workspace = true }
axum           = { workspace = true }
base64         = { workspace = true }
getrandom      = "0.4"
hex            = { workspace = true }
rust_decimal   = { workspace = true }
rmcp           = { version = "3.11", default-features = false, features = ["macros", "server", "transport-io"] }
schemars       = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
time           = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }

tower          = { version = "0.5", features = ["util"] }
sha2           = { workspace = true }

[dev-dependencies]
http-cache-semantics = { version = "3", default-features = false }
emob-poi       = { workspace = true }
jsonschema     = { workspace = true }
emob-eichrecht = { workspace = true }
hex            = { workspace = true }
p256           = { workspace = true }
time           = { workspace = true }
ocmf           = { workspace = true }
