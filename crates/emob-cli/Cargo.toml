[package]
name        = "emob-cli"
publish     = false
description = "The emob command line: `emob verify <transparency-file>` checks every signed meter value in a S.A.F.E. transparency file offline, with the same check the receipt page runs in the browser; `emob demo` runs the whole estate on loopback with simulated stations and a roaming partner"
keywords    = ["ocmf", "eichrecht", "cli", "verification", "ev-charging"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
# `emob demo` links roamd, and roamd speaks to `ocpi-kit`, which asks for the
# toolchain's 1.96 — the same reason `emob-roam` overrides the workspace floor.
rust-version = "1.96"

[[bin]]
name = "emob"
path = "src/main.rs"
# `verify` is tested from outside, as a driver runs it (`tests/`); the demo's
# guards (SR-070..SR-077) are unit tests beside the code they hold.

[dependencies]
emob-eichrecht = { workspace = true }
emob-verify    = { path = "../emob-verify" }

# `emob demo`: the estate's own daemons, started through the `daemon::run` each
# `main` is a configuration shim over, with the kits' station and partner as
# the counterparties. Every crate below is already in the workspace's graph.
billd          = { path = "../../services/billd" }
csmsd          = { path = "../../services/csmsd" }
deskd          = { path = "../../services/deskd" }
empd           = { path = "../../services/empd" }
roamd          = { path = "../../services/roamd" }
poid           = { path = "../../services/poid" }
tarifd         = { path = "../../services/tarifd" }
emob-core      = { workspace = true }
emob-ocpp      = { workspace = true }
emob-service   = { workspace = true, features = ["schema"] }
emob-sim       = { workspace = true }
ocpp-kit       = { workspace = true, features = ["std", "tokio", "station", "rustls", "v1_6", "v2_0_1", "v2_1"] }
ocpi-kit       = { workspace = true, features = ["client", "server", "testkit"] }
# `demo --check` reads the invoice files back and validates them (spec 010).
en16931        = { workspace = true }
en16931-formats = { workspace = true }
reqwest        = { version = "0.13", default-features = false, features = ["rustls"] }
anyhow         = { workspace = true }
axum           = { workspace = true }
base64         = { workspace = true }
getrandom      = "0.4"
hex            = { workspace = true }
rust_decimal   = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
time           = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }

[dev-dependencies]
jsonschema     = { workspace = true }
emob-eichrecht = { workspace = true }
hex            = { workspace = true }
p256           = { workspace = true }
sha2           = { workspace = true }
time           = { workspace = true }
ocmf           = { workspace = true }
