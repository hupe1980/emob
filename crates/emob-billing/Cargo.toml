[package]
name        = "emob-billing"
description = "Rated EV charging records turned into money: invoice lines whose rounding is stated rather than discovered, the German VAT treatment of a roaming settlement as an executable rule, an EN 16931 e-invoice, a SEPA collection and balanced double-entry postings"
keywords    = ["ev-charging", "invoice", "en16931", "sepa", "vat"]
categories  = ["finance", "data-structures"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
emob-core    = { workspace = true }
emob-cdr     = { workspace = true }
emob-tariff  = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true, optional = true }
thiserror    = { workspace = true }
time         = { workspace = true }

# ── The invoice and the payment ─────────────────────────────────────────────
# Two standards this crate has to *speak*, each already owned by a sibling crate
# that carries the rules as well as the shapes. Default features off: nothing
# here needs a database, a PDF or an XML *parser*, and `just purity` greps this
# workspace's source rather than a dependency's — so the guarantee that a
# billing run replays rests on the feature sets declared here.
#
# No ledger: posting into a journal needs a journal, which is `billd`'s. See
# `src/postings.rs`.
en16931         = { workspace = true }
en16931-formats = { workspace = true }
sepa            = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = [
    "dep:serde",
    "en16931/serde",
    "emob-core/serde",
    "emob-cdr/serde",
    "emob-tariff/serde",
    "rust_decimal/serde",
    "time/serde-well-known",
]

[dev-dependencies]
ocmf           = { workspace = true }
# The end-to-end test signs real OCMF records at test time and runs them through
# the same path a station would, so the month it closes starts at a meter rather
# than at a constant.
emob-eichrecht = { workspace = true }
emob-session   = { workspace = true }
hex            = { workspace = true }
p256           = { workspace = true }
serde_json     = { workspace = true }
sha2           = { workspace = true }
