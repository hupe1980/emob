[package]
name        = "emob-poi"
description = "The charge point register and its national access point feed: a DATEX II AFIR Recharging publication generated from the same tariff that prices the session, so the price a route planner shows and the price on the invoice cannot disagree"
keywords    = ["ev-charging", "afir", "datex2", "mobilithek", "open-data"]
categories  = ["science", "data-structures"]
readme      = "README.md"

version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# `serde` is **not** optional here, unlike everywhere else in this workspace:
# `Published` is what a service journals about an accepted table. The documents
# themselves are `datex2`'s to write.
[dependencies]
datex2       = { workspace = true }
emob-core    = { workspace = true }
emob-tariff  = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
time = { workspace = true, features = ["macros"] }
