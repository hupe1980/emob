# Single-host estate. Keep one writer per journal volume and terminate TLS for remote clients.
name: emob

# Probe /health/live and /health/ready from outside the distroless containers.
# Merge shared variables into each environment explicitly because YAML merges are shallow.
x-env: &env
  EMOB_JOURNAL_DIR: /var/lib/emob
  # The one a container cannot do without. Every daemon defaults to loopback —
  # which is right on a laptop and reachable by nothing inside a container — so
  # the estate-wide address is set here rather than in nine places. A daemon's
  # own `<DAEMON>_HTTP_BIND` still wins over it.
  EMOB_HTTP_BIND: 0.0.0.0:8080
  RUST_LOG: ${RUST_LOG:-info}
  # The estate: one file, mounted read-only, every daemon reading its sections.
  EMOB_ESTATE: /etc/emob/estate.toml
  # The secrets the estate names by variable. No defaults: a default secret is
  # one every reader of this repository holds, and `:?` refuses to start the
  # estate with a message rather than leave a container crash-looping.
  EMOB_WEBHOOK_SECRET: ${EMOB_WEBHOOK_SECRET:?set EMOB_WEBHOOK_SECRET (whsec_<base64>) — the daemons sign what they hand each other}
  EMOB_SERVICE_TOKEN: ${EMOB_SERVICE_TOKEN:?set EMOB_SERVICE_TOKEN — csmsd presents it to empd}
  EMOB_DESK_READ_TOKEN: ${EMOB_DESK_READ_TOKEN:?set the desk background read credential}
  EMOB_OPERATOR_TOKEN: ${EMOB_OPERATOR_TOKEN:?set the named operator write credential}
  EMOB_PARTNER_DE_MSP_TOKEN_A: ${EMOB_PARTNER_DE_MSP_TOKEN_A:?set EMOB_PARTNER_DE_MSP_TOKEN_A — the Token A the demo partner registers with}

x-daemon: &daemon
  restart: unless-stopped
  environment:
    <<: *env

services:
  csmsd:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-csmsd:${VERSION:-dev}
    build: { context: ., args: { DAEMON: csmsd } }
    environment:
      <<: *env
      # The second socket has its own variable: the estate-wide one names the
      # shell's address, and applying it to both would bind them to one port.
      CSMSD_BIND: 0.0.0.0:9000
      # The key csmsd's journal is sealed under: its answers, CDRs and
      # deliveries carry card UIDs (SR-048). `just dev-keys` prints one.
      CSMSD_DATA_KEY: ${CSMSD_DATA_KEY:?set CSMSD_DATA_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
      # The Ed25519 seed csmsd signs its journal head with after every append
      # (spec 008); a journal shorter than its signed head does not start.
      CSMSD_SIGNING_KEY: ${CSMSD_SIGNING_KEY:?set CSMSD_SIGNING_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
    ports:
      - "127.0.0.1:8080:8080"   # the shell
      - "9000:9000"   # the OCPP WebSocket a station dials — wss://, profile 2
    # The listener's certificate: a public bind without TLS refuses to start
    # (SR-042). `just up` mints a throwaway one with `just dev-ca`.
    volumes: [csmsd:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro, ./target/dev-tls:/tls:ro]

  roamd:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-roamd:${VERSION:-dev}
    build: { context: ., args: { DAEMON: roamd } }
    environment:
      <<: *env
      # Partners' tokens are digested and sealed under it (SR-044).
      ROAMD_DATA_KEY: ${ROAMD_DATA_KEY:?set ROAMD_DATA_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
      # The Ed25519 seed roamd signs its journal head with after every append
      # (spec 008); a journal shorter than its signed head does not start.
      ROAMD_SIGNING_KEY: ${ROAMD_SIGNING_KEY:?set ROAMD_SIGNING_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
    ports: ["127.0.0.1:8081:8080"]
    volumes: [roamd:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

  billd:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-billd:${VERSION:-dev}
    build: { context: ., args: { DAEMON: billd } }
    environment:
      <<: *env
      # The CDRs it receives carry card UIDs, its invoices the debtor's name and
      # IBAN (SR-087); a journal under another key refuses to start.
      BILLD_DATA_KEY: ${BILLD_DATA_KEY:?set BILLD_DATA_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
      # The Ed25519 seed billd signs its journal head with after every append
      # (spec 008); a journal shorter than its signed head does not start.
      BILLD_SIGNING_KEY: ${BILLD_SIGNING_KEY:?set BILLD_SIGNING_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
    ports: ["127.0.0.1:8082:8080"]
    volumes: [billd:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

  empd:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-empd:${VERSION:-dev}
    build: { context: ., args: { DAEMON: empd } }
    environment:
      <<: *env
      # The key token references are derived and UIDs sealed under (SR-046,
      # SR-047). No default: a default key is one every reader of this
      # repository holds — and destroying this one erases every UID empd ever
      # journalled, which is the point.
      EMPD_DATA_KEY: ${EMPD_DATA_KEY:?set EMPD_DATA_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
      # The Ed25519 seed empd signs its journal head with after every append
      # (spec 008); a journal shorter than its signed head does not start.
      EMPD_SIGNING_KEY: ${EMPD_SIGNING_KEY:?set EMPD_SIGNING_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
    ports: ["127.0.0.1:8083:8080"]
    volumes: [empd:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

  poid:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-poid:${VERSION:-dev}
    build: { context: ., args: { DAEMON: poid } }
    environment:
      <<: *env
      # The Ed25519 seed poid signs its journal head with after every append
      # (spec 008); a journal shorter than its signed head does not start.
      POID_SIGNING_KEY: ${POID_SIGNING_KEY:?set POID_SIGNING_KEY — 32 random bytes, base64; `just dev-keys` prints a set}
      # The identifier the Mobilithek issued this operator; poid refuses to
      # start without one (spec 012).
      POID_NAP_IDENTIFIER: ${POID_NAP_IDENTIFIER:?set POID_NAP_IDENTIFIER — the national access point identifier; `just dev-keys` prints DE-NAP-DEV}
    ports: ["127.0.0.1:8084:8080"]
    volumes: [poid:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

  tarifd:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-tarifd:${VERSION:-dev}
    build: { context: ., args: { DAEMON: tarifd } }
    ports: ["127.0.0.1:8085:8080"]
    volumes: [tarifd:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

  agentd:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-agentd:${VERSION:-dev}
    build: { context: ., args: { DAEMON: agentd } }
    ports: ["127.0.0.1:8086:8080"]
    volumes: [agentd:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

  # The operator's page. It reads the others' read models and keeps one thing:
  # the witness file — every journal head it read, so a journal cut short or
  # restored from an older backup is an alarm on Heute (spec 008). On its own
  # volume, which none of the daemons it watches can reach. Open
  # http://localhost:8088/ with any user name and $EMOB_OPERATOR_TOKEN as the
  # password.
  deskd:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-deskd:${VERSION:-dev}
    build: { context: ., args: { DAEMON: deskd } }
    ports: ["127.0.0.1:8088:8080"]
    volumes: [deskd:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

  # The one that is not deployed with the others. `sited` runs **at a site**,
  # beside the connection point, because `[LPC-912]` puts a site into its
  # failsafe when the Energy Guard goes quiet and a controller behind a broken
  # WAN link is a site held at 4.2 kW because this process could not be reached.
  # It is here so the estate can be brought up whole for a demonstration, and
  # that is the only reason.
  sited:
    <<: *daemon
    image: ${REGISTRY:-ghcr.io/hupe1980}/emob-sited:${VERSION:-dev}
    build: { context: ., args: { DAEMON: sited } }
    # No SHIP port: the session `[LPC §3.3]` prescribes is a socket a
    # deployment supplies, and this daemon does not open one yet (M12). A
    # mapping here would be a port with nothing behind it.
    ports: ["127.0.0.1:8087:8080"]
    volumes: [sited:/var/lib/emob, ./deploy/estate.compose.toml:/etc/emob/estate.toml:ro]

volumes:
  csmsd: {}
  roamd: {}
  billd: {}
  empd: {}
  poid: {}
  tarifd: {}
  agentd: {}
  sited: {}
  deskd: {}
