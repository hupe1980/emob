#:schema ../schemas/estate.schema.json

# The demonstration estate — one file every emob daemon reads its own sections of.
#
# Path: EMOB_ESTATE (default ./estate.toml). A daemon reads only the sections it
# uses and refuses to start, naming the key, on one it cannot parse. Secrets are
# never written here: every `*_env` field names an environment variable.
# `emob check estate.toml` checks it before a daemon does; the line at the top
# lets Taplo or Tombi complete and check it as you type.
#
# Loopback only: `[roaming] reach_back_allow` lets the OCPI handshake reach a
# partner on 127.0.0.1 over http, which a production estate must not allow.

[parties]
operator = "DE*ABC"   # the CPO: stations, CDRs and invoices are issued under it
provider = "DE*MSP"   # the e-mobility provider empd runs

[[stations]]
identity = "CP-1"
ocpp = "1.6"
# Security profile 2: HTTP Basic over TLS. The hash is of the demo station's
# AuthorizationKey 6d6f636b2d73746174696f6e2d736563726574 (hex of
# "mock-station-secret"); `csmsd hash-password 1.6` prints one for yours.
security_profile = 2
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$q1iothavEHNDTeGVTzaU5A$FPoYufVFH6pj8V/ENPoPB3jm497gMXbSv9Y82oKyfYA"
evse = "DE*ABC*E00001"
rated_power_kw = "150"
tariff = "ad-hoc"
connector = "iec62196_t2_combo"
# Show the receipt link on the station's own display for 1–15
# minutes after a session (`SetDisplayMessage`, OCPP 2.0.1 and 2.1 only — a 1.6
# station like this one is named at start-up and skipped). Off when absent: a
# screen is public, and the next person at it can read the link.
# receipt_display_minutes = 5
location = { id = "LOC-1", name = "Depot Mitte", street = "Invalidenstrasse", house_number = "1", postal_code = "10115", city = "Berlin", country = "DE", latitude = "52.531800", longitude = "13.384900", time_zone = "Europe/Berlin" }

# The public key of emob-sim's first virtual meter (Rng::stream(2026, "estate")),
# out of band — never the key a station sends on its own socket.
[[meter_keys]]
meter = "SIM-METER-00001"
curve = "secp256r1"
key = "042d356388ae4082b9d5d77278f29947f9893b272cd58ba98151272cf5b3861f48dbfd493d2686037dcc7ecd64312b498ed13b44734010be5e6526480d6a906808"
provenance = "emob-sim virtual meter 1 — demonstration only"

[[tariffs]]
id = "ad-hoc"
currency = "EUR"
time_zone = "Europe/Berlin"
energy = "0.49"   # gross, per kWh: the price a driver is shown, VAT included [PAngV §3(1)]
vat = "19"        # the rate inside it; the invoice strips it, and asks for what the receipts said

[[partners]]
party = "DE*MSP"
token_a_env = "EMOB_PARTNER_DE_MSP_TOKEN_A"
signed_data = true
settles_within_days = 30
billing = { name = "MSP Mobility GmbH", street = "Am Markt 2", post_code = "50667", city = "Köln", country = "DE", vat_id = "DE123456789" }
# The EN 16931 specification its invoices are written in (BT-24): "en16931"
# (the default) or "xrechnung" for a public buyer or a partner that asks for it.
# XRechnung also needs `electronic_address` in `billing` above and in the
# seller's, and a `[billing] contact`.
# specification = "xrechnung"
# Its reference for our invoices (BT-10) — a Leitweg-ID for a public buyer.
# buyer_reference = "04011000-12345-67"
# Its SEPA direct-debit mandate; without one, it pays by transfer.
# mandate = { reference = "MANDATE-0001", iban = "DE02120300000000202051" }

[billing]
series = "R"
vat_rate = "19"
seller = { name = "ABC Charging GmbH", street = "Invalidenstrasse 1", post_code = "10115", city = "Berlin", country = "DE", vat_id = "DE987654321" }
# Optional. The account a partner paying by transfer pays into (BT-84), and the
# SEPA creditor identifier a mandate is collected under (BT-90).
# iban = "DE89370400440532013000"
# creditor_id = "DE98ZZZ09999999999"
# The seller's contact (BG-6), which XRechnung requires.
# contact = { name = "Abrechnung", phone = "+49 30 1234567", email = "abrechnung@example.org" }
# Where an invoice page is linked from: every issued invoice is readable at
# `<public_url>/i/<token>` with its UBL and CII files. The token is minted under
# `invoice.key`, created beside billd's journal on first start.
# public_url = "http://127.0.0.1:9584"

# Optional. Hand every issued invoice to the operator's ERP or Peppol provider:
# a de.emob.invoice.issued CloudEvent whose data is the UBL or CII file, signed
# under Standard Webhooks with the secret `secret_env` names (whsec_<base64>),
# `webhook-id` = the invoice number, posted until it answers. A 2xx
# accepts it (then it is booked), 401/408/429/5xx or no answer is retried, any
# other 4xx rejects it. https only, or http on loopback.
# [billing.delivery]
# url = "https://erp.example.org/einvoices"
# secret_env = "EMOB_INVOICE_DELIVERY_SECRET"
# syntax = "ubl"   # or "cii"

# Optional, any number. A system outside the estate that receives emob's
# events as signed CloudEvents: de.emob.cdr.issued (csmsd) and
# de.emob.invoice.issued (billd). Its own secret; https, or http on loopback.
# A pattern that admits no emitted type refuses the start.
# [[subscribers]]
# name = "warehouse"
# url = "https://dwh.example.org/emob/events"
# secret_env = "EMOB_WAREHOUSE_SECRET"
# types = ["de.emob.*"]

[[contracts]]
id = "DE-MSP-C00000001-W"
from = "2026-01-01"
tokens = [
  { uid = "04A1B2C3D4E5F6", type = "RFID", whitelist = "ALLOWED" },
  { uid = "04DEADBEEF0001", type = "RFID", whitelist = "ALLOWED", blocked = true },
]

# `name` is who this operator is on every journal record and log line it causes
# (`operator:<name>`): 1–64 of [A-Za-z0-9*._:=+|@ -], refused at start otherwise.
[[operators]]
name = "demo operator"
token_env = "EMOB_OPERATOR_TOKEN"

# How csmsd's OCPP listener is exposed. Throwaway loopback certificates —
# `just dev-ca` writes these. A production estate names its own.
[csms]
tls_cert = "../target/dev-tls/server.pem"
tls_key = "../target/dev-tls/server.key"
client_ca = "../target/dev-tls/ca.pem"
max_connections = 1024
messages_per_minute = 120
idle_timeout_secs = 900

# What the operator page (deskd) reads, with which of the operator tokens. billd
# and roamd are read at their [services] addresses.
[desk]
csmsd = "http://127.0.0.1:9001"
token_env = "EMOB_OPERATOR_TOKEN"
time_zone = "Europe/Berlin"   # the page's "today" and its clock
ocpp_url = "wss://127.0.0.1:9000/ocpp"   # printed on the installer sheet a new station gets

[receipts]
# Where a driver's phone reaches csmsd's shell: every receipt link
# (`<public_url>/r/<token>`) starts here, on invoice lines too. The
# token is minted under `receipt.key`, created beside the journal on first start.
public_url = "http://127.0.0.1:9001"

[services]
billd = "http://127.0.0.1:9584"
roamd = "http://127.0.0.1:9583"
empd = "http://127.0.0.1:9585"
webhook_secret_env = "EMOB_WEBHOOK_SECRET"   # whsec_<base64>
service_token_env = "EMOB_SERVICE_TOKEN"
authorize_timeout_ms = 2000
retry_secs = 5

[roaming]
public_url = "http://127.0.0.1:9583/ocpi"
reach_back_allow = ["127.0.0.1", "localhost"]

# What the witness trusts. deskd reads every journalled daemon's
# signed head (GET /v1/<name>/head) every 30 s and alarms on Heute when one goes
# backwards, forks or comes under another key. A daemon named here is checked
# against this verifier key (what the head's Emob-Verifier-Key header says);
# one not named is pinned the first time it is seen — trust on first use, and
# Heute says which.
[witness]
keys = {}   # e.g. { csmsd = "emob/csmsd+1a2b3c4d+AXJ…" }
