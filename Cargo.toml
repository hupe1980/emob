[workspace]
resolver = "3"
members = [
    "crates/emob-core",
    "crates/emob-eichrecht",
    "crates/emob-session",
    "crates/emob-cdr",
    "crates/emob-billing",
    "crates/emob-tariff",
    "crates/emob-thg",
    "crates/emob-ocpp",
    "crates/emob-poi",
    "crates/emob-sim",
    "crates/emob-roam",
    "crates/emob-service",
    "services/agentd",
    "services/csmsd",
    "xtask",
]

[workspace.package]
version      = "0.1.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/emob"
rust-version = "1.94"

[workspace.dependencies]
# ── External ────────────────────────────────────────────────────────────────
thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
# `arbitrary_precision` is not optional for this workspace: without it
# `serde_json` parses every number through `f64`, and OCMF's `2935.600` — three
# decimals the meter is *stating* as its accuracy — comes back as `2935.6`. With
# it, `Number` keeps the literal and `emob-eichrecht` reads the exact decimal the
# station wrote. `preserve_order` matters for the same reason one layer up: a
# document that is re-emitted must not silently reorder what a peer sent.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
time       = { version = "0.3", features = ["std", "macros", "parsing", "formatting"] }
uuid       = { version = "1", features = ["v4", "v7", "serde"] }
anyhow     = "1"

# Every quantity in this workspace either *is* money or *becomes* money. A
# binary float cannot represent 0.10, and `10.1 - 0.1` is 10.000000000000002 —
# which is precisely the subtraction OCMF prescribes for a session's energy.
# `cargo xtask no-floats` fails the build on an `f32`/`f64` in any public API.
rust_decimal = { version = "1", features = ["macros", "serde-with-str"] }

# ── The OCPP wire ───────────────────────────────────────────────────────────
# Only `emob-ocpp` and `csmsd` see these types. The seam's own vocabulary has no
# OCPP in it, deliberately: OCPP's model of a meter value is the wrong model for
# money, and a crate that imported it in order to convert away from it would
# have the wrong types in scope exactly where it matters.
#
# 0.2 is the first release that can carry money: every OCPP `number` is an exact
# decimal rather than an `f64`, and `metering` reads the signed meter record —
# the value §33 MessEG lets a customer check — out of both the 2.x field and the
# 1.6 `SignedData` string that holds the same object. Only `emob-ocpp` and
# `csmsd` depend on it; everything that decides money does not.
ocpp-kit = { version = "0.2", default-features = false }

# ── The OCPI wire ───────────────────────────────────────────────────────────
# Only `emob-roam` sees these types. `convert` is not an extra: a partner on
# 2.2.1 is the ordinary case, and the point of the crossing is that what the
# downgrade cost is reported rather than decided silently.
ocpi-kit = { version = "0.2", default-features = false, features = ["v2_3_0", "v2_2_1", "convert"] }

# ── The vehicle wire ────────────────────────────────────────────────────────
# A **dev**-dependency of `emob-core`, and only that, until `emob-pnc` is built.
# `emob-core` decides money and carries no protocol implementation in its tree,
# but the two crates name the same generations — and 0.3 is where that spelling
# got an owner (`Protocol::as_str`, `Display`, `FromStr`, and a `FromStr` that
# refuses a bare `iso15118` because the DATEX II profile defines that literal as
# -20 and has no literal for -2). `crates/emob-core/tests/the_kits_agree.rs`
# asserts the two spellings are one spelling, which is a test rather than a hope.
iso15118 = { version = "0.3", default-features = false }

# ── The money leaves the platform ───────────────────────────────────────────
# Only `emob-billing` sees these. Three standards this workspace has no business
# re-reading — EN 16931 and its two mandatory syntaxes, ISO 20022's SEPA
# messages, and double-entry bookkeeping — each already owned by a sibling crate
# that carries the rules as well as the shapes.
#
# `en16931` is taken **without** its `billing` adapter: the arithmetic that
# decides what a session costs is `emob-tariff`'s, and a second engine that could
# produce a different number for the same session is the drift this workspace
# exists to make unrepresentable. `time` rather than `chrono`, because every
# instant here is a `time::OffsetDateTime`.
en16931 = { version = "0.6", default-features = false, features = ["time"] }

# The syntax half, `ubl` only. `cii` and `zugferd` are the other two mandatory
# formats and nothing in this workspace asks for them yet; `roxmltree` and
# `lopdf` come with *reading* a document, and emob writes.
en16931-formats = { version = "0.6", default-features = false, features = ["ubl"] }

# pain.008 for the collection, and the IBAN/BIC/Creditor-Id validation that
# stops an unpayable instruction being written in the first place. Its `time`
# feature so a date crosses as a date.
#
# Note for `emob-billing`: this crate's builders **default** several fields off
# the system clock — `IsoDate::today()` for a collection date, `now` for the
# message timestamp. Every one of them is an argument at this workspace's seam,
# because a domain crate that reads a clock cannot be replayed (see `just
# purity`), and a collection file that differs between two runs of one billing
# job is a file no bank reconciles.
sepa = { version = "0.6", default-features = false, features = ["time"] }

# Balanced by construction, exact integer money, no I/O in the default build.
# `emob-billing` produces postings by **role** and hands the chart of accounts
# back to the caller: a domain crate that named its own accounts would be
# telling an operator how to keep their books.
doubleentry = { version = "0.7", default-features = false }

# ── Eichrecht: OCMF signature verification ──────────────────────────────────
# The curves OCMF Table 22/23 name. secp256r1 is the default since OCMF 0.4 —
# and secp192r1 is not a legacy curiosity: the eBZ LD3 data set shipped with the
# S.A.F.E. Transparenzsoftware as a reference sample is signed
# `ECDSA-secp192r1-SHA256`, so a verifier without it cannot check a common
# German meter. The two brainpool curves have no usable pure-Rust arithmetic
# (RustCrypto's `bp256`/`bp384` gate theirs behind `wip-arithmetic-do-not-use`),
# which is why `emob-eichrecht` recognises and refuses them by name.
sha2      = "0.10"
p192      = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p256      = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384      = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
k256      = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
ecdsa     = { version = "0.16", features = ["der"] }
signature = "2"
hex       = "0.4"
base64    = "0.22"

# ── Internal (path + version so the domain crates can be published) ─────────
emob-core      = { path = "crates/emob-core",      version = "0.1" }
emob-eichrecht = { path = "crates/emob-eichrecht", version = "0.1" }
emob-session   = { path = "crates/emob-session",   version = "0.1" }
emob-cdr       = { path = "crates/emob-cdr",       version = "0.1" }
emob-tariff    = { path = "crates/emob-tariff",    version = "0.1" }
emob-ocpp      = { path = "crates/emob-ocpp",      version = "0.1" }
emob-poi       = { path = "crates/emob-poi",       version = "0.1" }
emob-sim       = { path = "crates/emob-sim",       version = "0.1" }
emob-roam      = { path = "crates/emob-roam",      version = "0.1" }
emob-billing   = { path = "crates/emob-billing",   version = "0.1" }
emob-thg       = { path = "crates/emob-thg",       version = "0.1" }
emob-service   = { path = "crates/emob-service",   version = "0.1" }

# ── The daemon shell ────────────────────────────────────────────────────────
# Only `emob-service` and the daemons above it see these. Every domain crate
# stays sans-I/O: the clock and the socket live here so a two-year-old dispute
# can be replayed without either.
axum               = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio              = { version = "1", default-features = false }
tokio-util         = { version = "0.7", default-features = false }
tower-http         = { version = "0.6", default-features = false, features = ["trace", "request-id"] }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std", "ansi"] }
toml               = { version = "0.9", default-features = false, features = ["parse", "serde"] }
http               = "1"

# Standard Webhooks signatures are HMAC-SHA256 over `id.timestamp.payload`,
# base64 — and the comparison has to be constant time, which is what `subtle`
# is for. A signature compared with `==` leaks where two differ, one byte of
# timing at a time.
hmac   = { version = "0.12", default-features = false }
subtle = { version = "2", default-features = false }

# ── The agent plane ─────────────────────────────────────────────────────────
# Only `agentd`. The runtime whose journal is the plan of record: every effect
# performed at most once, written to an append-only hash-chained log, and read
# back on replay. `manifest` because what an agent may do has to be a file a
# reviewer sees in a diff rather than a builder call nobody reads.
agentplane = { version = "0.26", default-features = false, features = ["redb", "manifest"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
