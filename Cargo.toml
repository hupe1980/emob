[workspace]
resolver = "3"
members = [
    "crates/emob-core",
    "crates/emob-eichrecht",
    "crates/emob-session",
    "crates/emob-cdr",
    "crates/emob-billing",
    "crates/emob-tariff",
    "crates/emob-thg",
    "crates/emob-ocpp",
    "crates/emob-eebus",
    "crates/emob-pnc",
    "crates/emob-poi",
    "crates/emob-sim",
    "crates/emob-smart",
    "crates/emob-roam",
    "crates/emob-service",
    "services/agentd",
    "services/billd",
    "services/csmsd",
    "services/empd",
    "services/poid",
    "services/roamd",
    "services/sited",
    "services/tarifd",
    "xtask",
]

[workspace.package]
version      = "0.1.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/emob"
rust-version = "1.94"

[workspace.dependencies]
# ── External ────────────────────────────────────────────────────────────────
thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
# `arbitrary_precision` is not optional for this workspace: without it
# `serde_json` parses every number through `f64`, and OCMF's `2935.600` — three
# decimals the meter is *stating* as its accuracy — comes back as `2935.6`. With
# it, `Number` keeps the literal and `emob-eichrecht` reads the exact decimal the
# station wrote. `preserve_order` matters for the same reason one layer up: a
# document that is re-emitted must not silently reorder what a peer sent.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
time       = { version = "0.3", features = ["std", "macros", "parsing", "formatting"] }

# A tariff's "0.30 from 22:00" is local civil time at the charge point, and an
# offset is not a zone: judged against whatever offset a timestamp carried, the
# same session costs a different amount (D175). `jiff` resolves an instant into a
# named IANA zone and does nothing else here. `tzdb-bundle-always` compiles the
# database in; the platform and zoneinfo lookups that would read the filesystem
# or `TZ` are off, so `just purity` holds and `Cargo.lock` pins what a replay
# replays against.
jiff       = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
anyhow     = "1"

# Every quantity in this workspace either *is* money or *becomes* money. A
# binary float cannot represent 0.10, and `10.1 - 0.1` is 10.000000000000002 —
# which is precisely the subtraction OCMF prescribes for a session's energy.
# `cargo xtask no-floats` fails the build on an `f32`/`f64` in any public API.
rust_decimal = { version = "1", features = ["macros", "serde-with-str"] }

# ── The OCPP wire ───────────────────────────────────────────────────────────
# Only `emob-ocpp` and `csmsd` see these types. The seam's own vocabulary has no
# OCPP in it, deliberately: OCPP's model of a meter value is the wrong model for
# money, and a crate that imported it in order to convert away from it would
# have the wrong types in scope exactly where it matters.
#
# 0.2 is the first release that can carry money: every OCPP `number` is an exact
# decimal rather than an `f64`, and `metering` reads the signed meter record —
# the value §33 MessEG lets a customer check — out of both the 2.x field and the
# 1.6 `SignedData` string that holds the same object. Only `emob-ocpp` and
# `csmsd` depend on it; everything that decides money does not.
ocpp-kit = { version = "0.2", default-features = false }

# ── The OCPI wire ───────────────────────────────────────────────────────────
# Only `emob-roam` sees these types. `convert` is not an extra: a partner on
# 2.2.1 is the ordinary case, and the point of the crossing is that what the
# downgrade cost is reported rather than decided silently.
#
# Invoice Reconciliation is the module 2.3.0 added for the half this workspace
# is about. A CDR and its invoice line cannot disagree inside one process, and
# between two *companies* nothing tied them together at all: the records go over
# OCPI and the invoice over an access point, and neither document says which
# records the other is about. That is the seam `emob-billing` ends at and the one
# `emob-roam` now carries. It needs no feature: upstream moved the module into
# core 2.3.0 in July 2026 — in place, on a released branch, with no version bump
# — and `payments` went the other way, out of core onto a branch. This workspace
# does not take `payments`: a pre-authorisation hold is the acquirer's and
# `Tariff.preauthorize_amount` decides nothing `emob-tariff` computes.
ocpi-kit = { version = "0.3", default-features = false, features = ["v2_3_0", "v2_2_1", "convert"] }

# ── The OICP wire ───────────────────────────────────────────────────────────
# Also only `emob-roam`. OICP is hub-and-spoke where OCPI is peer-to-peer —
# every partner talks to Hubject and Hubject calls back — so the crossing is the
# same shape and the transport is not, which is why `transport`, `client` and
# `server` stay off: those are `roamd`'s and they carry `reqwest`, `axum` and
# `tokio` behind them. A domain crate takes `cpo` and `emp`, which are the wire
# *model*, and `eichrecht`, which is the CDR pre-flight Hubject and an EMP each
# run against a record before it is billed.
#
# Every OICP `number` is an exact decimal in this kit, which is what lets
# `ConsumedEnergy` be the difference between the two register readings rather
# than nearly it — the same promise `no-floats` makes on this side of the seam.
oicp-kit = { version = "0.1", default-features = false, features = ["cpo", "emp", "eichrecht"] }

# ── The vehicle wire ────────────────────────────────────────────────────────
# Two consumers, and they take different things.
#
# `emob-core` takes it as a **dev**-dependency and nothing more: that crate
# decides money and carries no protocol implementation in its tree, but the two
# name the same generations, and a `FromStr` that refuses a bare `iso15118` is
# the spelling this workspace has to share. `the_kits_agree.rs` asserts it.
#
# `emob-pnc` takes it for real, with **`pnc` and nothing else**: the Annex F
# certificate profiles and the path validation behind them. That feature pulls
# no cryptography — the curve and the hash are traits a caller implements — which
# is what lets ISO 15118 chain validation live in a domain crate without a second
# RustCrypto generation beside `ocmf`'s (D304). The EXI codec, the message sets
# and the session engines are a station's and a vehicle's; nothing speaks to a
# car.
iso15118 = { version = "0.4", default-features = false }

# ── The § 14a wire ──────────────────────────────────────────────────────────
# SHIP, SPINE and the use-case descriptors, **without `runtime`**: no tokio, no
# rustls, no mDNS. `emob-eebus` is a domain crate and `cargo xtask check-graph`
# is what keeps it one — the sockets belong to `sited`.
#
# What this workspace takes is the *protocol*. The **rule** — what a site draws
# while nobody is telling it anything — is `emob-smart`'s, read from
# `[LPC §2.3.2]` and decided there (D302).
eebus = { version = "0.9", default-features = false, features = ["std"] }

# ── The money leaves the platform ───────────────────────────────────────────
# Only `emob-billing` sees these. Three standards this workspace has no business
# re-reading — EN 16931 and its two mandatory syntaxes, ISO 20022's SEPA
# messages, and double-entry bookkeeping — each already owned by a sibling crate
# that carries the rules as well as the shapes.
#
# `en16931` is taken **without** its `billing` adapter: the arithmetic that
# decides what a session costs is `emob-tariff`'s, and a second engine that could
# produce a different number for the same session is the drift this workspace
# exists to make unrepresentable. `time` rather than `chrono`, because every
# instant here is a `time::OffsetDateTime`.
en16931 = { version = "0.7", default-features = false, features = ["time"] }

# The syntax half: **both** the formats CEN/TS 16931-2 makes mandatory. UBL is
# what the German platforms take by default and CII is what a partner may
# require instead — and every ZUGFeRD payload is a CII document, so the one
# binding serves the next consumer too. `zugferd` itself is the hybrid PDF and
# stays off: `en16931-formats` reads those and does not write them, and `lopdf`
# takes the graph from thirteen crates to fifty-seven.
en16931-formats = { version = "0.7", default-features = false, features = ["ubl", "cii"] }

# pain.008 for the collection, and the IBAN/BIC/Creditor-Id validation that
# stops an unpayable instruction being written in the first place. Its `time`
# feature so a date crosses as a date.
#
# The two values a replay cannot tolerate — the collection date and the message
# id's timestamp — are constructor arguments rather than defaults, because a
# domain crate that reads a clock cannot be replayed and a collection file that
# differs between two runs of one billing job is a file no bank reconciles
# (D304). `created_at` is the one that stays optional; `emob-billing` passes it,
# and `just purity` keeps it passing.
doubleentry = { version = "0.7", default-features = false }
sepa = { version = "0.7", default-features = false, features = ["time"] }

# ── Eichrecht: the OCMF format ──────────────────────────────────────────────
# The format is `ocmf`'s and the law is `emob-eichrecht`'s: that crate keeps only
# the question `ocmf` refuses, which quantity a finding takes away (D184).
#
# `session` is the sequence half `[OCMF §Signing and Verification Process]`
# assigns to a check component; `xml` is the S.A.F.E. transparency container.
# `curves-pure` is the four that verify without a C library — secp192r1 included,
# because the eBZ LD3 sample the Transparenzsoftware ships is signed with it. The
# other three of `[OCMF Tab. 22]` need the crate's OpenSSL backend, which a
# domain crate may not link, so they are refused by name.
ocmf = { version = "0.1", default-features = false, features = [
    "std", "verify", "curves-pure", "session", "xml",
] }

# Signing, for the simulator's virtual meters and for test fixtures only.
# Nothing on the billing path signs anything: `ocmf` verifies.
#
# **One RustCrypto generation here, and it is `ocmf`'s (D304).** The 1.0-track
# releases — `sha2` 0.11, `hmac` 0.13, `p256` 0.14 — take `digest` 0.11 and
# `ecdsa` 0.17 with them, and `ocmf` links 0.10 and 0.16. Two implementations of
# SHA-256 in one binary would compile, because the boundary is SEC1 bytes, and
# that is the problem: the simulator is only worth something if the signature it
# writes and the signature `ocmf` checks go through the same code. When `ocmf`
# moves, this moves.
sha2      = "0.10"
p256      = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# The other curve `[V2G2-884]`'s Annex F admits, and the one ISO 15118-20 raises
# to: secp521r1. On the same `ecdsa` 0.16 / `elliptic-curve` 0.13 generation as
# `p256` above, so taking it costs no second implementation of anything —
# which is the whole of D304's rule and the reason the check was worth making.
p521      = { version = "0.13", default-features = false, features = ["ecdsa"] }
hex       = "0.4"
base64    = "0.23"

# ── Internal (path + version so the domain crates can be published) ─────────
emob-core      = { path = "crates/emob-core",      version = "0.1" }
emob-eichrecht = { path = "crates/emob-eichrecht", version = "0.1" }
emob-session   = { path = "crates/emob-session",   version = "0.1" }
emob-cdr       = { path = "crates/emob-cdr",       version = "0.1" }
emob-tariff    = { path = "crates/emob-tariff",    version = "0.1" }
emob-ocpp      = { path = "crates/emob-ocpp",      version = "0.1" }
emob-eebus     = { path = "crates/emob-eebus",     version = "0.1" }
emob-pnc       = { path = "crates/emob-pnc",       version = "0.1" }
emob-poi       = { path = "crates/emob-poi",       version = "0.1" }
emob-sim       = { path = "crates/emob-sim",       version = "0.1" }
emob-smart     = { path = "crates/emob-smart",     version = "0.1" }
emob-roam      = { path = "crates/emob-roam",      version = "0.1" }
emob-billing   = { path = "crates/emob-billing",   version = "0.1" }
emob-thg       = { path = "crates/emob-thg",       version = "0.1" }
emob-service   = { path = "crates/emob-service",   version = "0.1" }

# ── The daemon shell ────────────────────────────────────────────────────────
# Only `emob-service` and the daemons above it see these. Every domain crate
# stays sans-I/O: the clock and the socket live here so a two-year-old dispute
# can be replayed without either.
axum               = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio              = { version = "1", default-features = false }
tokio-util         = { version = "0.7", default-features = false }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std", "ansi"] }
toml               = { version = "1.1", default-features = false, features = ["parse", "serde"] }

# Standard Webhooks signatures are HMAC-SHA256 over `id.timestamp.payload`,
# base64 — and the comparison has to be constant time, which is what `subtle`
# is for. A signature compared with `==` leaks where two differ, one byte of
# timing at a time.
hmac   = { version = "0.12", default-features = false }
subtle = { version = "2", default-features = false }

# ── The policy an operator writes ───────────────────────────────────────────
# Only `emob-service`, behind a feature that is **off** by default, and only
# `roamd` turns it on. The same argument `doubleentry` gets one manifest for
# (D181): a partner onboarded while the node runs is the one place a policy
# engine earns its weight, and it costs a hundred and eight crates — which every
# other daemon would carry for a decision it makes from a typed value.
#
# `cedar-policy` rather than a grammar of our own: the conditions an operator
# wants to write are a *language* — a grant that starts on a date, one that ends
# on one, one that turns on a role — and inventing one is how a capability model
# becomes a policy engine nobody specified and nothing validates. Cedar has a
# schema, a validator and a proof of its own analysis.
cedar-policy = { version = "4.12", default-features = false, features = ["datetime"] }

# ── The agent plane ─────────────────────────────────────────────────────────
# Only `agentd`. The runtime whose journal is the plan of record: every effect
# performed at most once, written to an append-only hash-chained log, and read
# back on replay. `manifest` because what an agent may do has to be a file a
# reviewer sees in a diff rather than a builder call nobody reads.
agentplane = { version = "0.30", default-features = false, features = ["redb", "manifest"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
