[workspace]
resolver = "3"
members = [
    "crates/emob-core",
    "crates/emob-eichrecht",
    "crates/emob-session",
    "crates/emob-cdr",
    "crates/emob-billing",
    "crates/emob-tariff",
    "crates/emob-thg",
    "crates/emob-ocpp",
    "crates/emob-eebus",
    "crates/emob-pnc",
    "crates/emob-poi",
    "crates/emob-sim",
    "crates/emob-smart",
    "crates/emob-roam",
    "crates/emob-service",
    "crates/emob-verify",
    "crates/emob-cli",
    "services/accountingd",
    "services/agentd",
    "services/billd",
    "services/csmsd",
    "services/deskd",
    "services/empd",
    "services/poid",
    "services/portald",
    "services/roamd",
    "services/sited",
    "services/tarifd",
    "xtask",
]
# The Python toolkit builds against a Python; the workspace does not.
exclude = ["emobtest"]

[workspace.package]
version      = "0.8.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/emob"
rust-version = "1.96"

[workspace.dependencies]
# ── External ────────────────────────────────────────────────────────────────
thiserror  = "2"
serde      = { version = "1", features = ["derive"] }
# Preserve key order on replay. OCPI decimal visitors require native number tokens.
serde_json = { version = "1", features = ["preserve_order"] }
time       = { version = "0.3", features = ["std", "macros", "parsing", "formatting"] }

# Pin IANA zone data for reproducible local tariff calculations without host filesystem access.
jiff       = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }
anyhow     = "1"

# Validate published event schemas against daemon payloads in tests.
jsonschema = { version = "0.61", default-features = false }
schemars   = { version = "1", default-features = false, features = ["std", "derive"] }

# DATEX II wire types for the Mobilithek recharging profile.
datex2     = "0.3"

# Preserve meter precision and round once at the currency boundary.
rust_decimal = { version = "1", features = ["macros", "serde-with-str"] }

# Station protocol types and signed meter values for OCPP 1.6 and 2.x.
ocpp-kit = { version = "0.8", default-features = false }

# Enable explicit version conversion and exact JSON prices. The daemon adds transport.
ocpi-kit = { version = "0.5", default-features = false, features = ["v2_3_0", "v2_2_1", "convert", "exact-json"] }

# Hubject CPO and EMP wire models with Eichrecht CDR checks.
oicp-kit = { version = "0.1", default-features = false, features = ["cpo", "emp", "eichrecht"] }

# The certificate validator enables pnc. Message codecs and station runtimes stay optional.
iso15118 = { version = "0.9", default-features = false }

# SHIP and SPINE types for site controls. Domain crates use the protocol without its network runtime.
eebus = { version = "0.14", default-features = false, features = ["std"] }

# Use emob-tariff for rating and EN 16931 for invoice validation.
en16931 = { version = "0.10", default-features = false, features = ["time"] }

# Support both mandatory invoice syntaxes, UBL and CII.
en16931-formats = { version = "0.10", default-features = false, features = ["ubl", "cii"] }

# Ledger postings and SEPA collection files take dates and timestamps from the caller.
doubleentry = { version = "0.9", default-features = false }
sepa = { version = "0.10", default-features = false, features = ["time"] }

# Enable session checking, S.A.F.E. XML, and the supported verification curves individually.
ocmf = { version = "0.2", default-features = false, features = [
    "std", "verify", "curve-p192", "curve-p256", "curve-p384", "curve-k256", "session", "xml",
] }

# Keep the simulator signing and OCMF verification on the same RustCrypto generation.
sha2      = "0.11"
p256      = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# The other curve `[V2G2-884]`'s Annex F admits, and the one ISO 15118-20 raises
# to: secp521r1. On the same `ecdsa` 0.17 / `elliptic-curve` 0.14 generation as
# `p256` above, so taking it costs no second implementation of anything —
# which is the whole of D304's rule and the reason the check was worth making.
p521      = { version = "0.14", default-features = false, features = ["ecdsa"] }
hex       = "0.4"
base64    = "0.23"

# ── Internal (path + version so the domain crates can be published) ─────────
emob-core      = { path = "crates/emob-core",      version = "0.8" }
emob-eichrecht = { path = "crates/emob-eichrecht", version = "0.8" }
emob-session   = { path = "crates/emob-session",   version = "0.8" }
emob-cdr       = { path = "crates/emob-cdr",       version = "0.8" }
emob-tariff    = { path = "crates/emob-tariff",    version = "0.8" }
emob-ocpp      = { path = "crates/emob-ocpp",      version = "0.8" }
emob-eebus     = { path = "crates/emob-eebus",     version = "0.8" }
emob-pnc       = { path = "crates/emob-pnc",       version = "0.8" }
emob-poi       = { path = "crates/emob-poi",       version = "0.8" }
emob-sim       = { path = "crates/emob-sim",       version = "0.8" }
emob-smart     = { path = "crates/emob-smart",     version = "0.8" }
emob-roam      = { path = "crates/emob-roam",      version = "0.8" }
emob-billing   = { path = "crates/emob-billing",   version = "0.8" }
emob-thg       = { path = "crates/emob-thg",       version = "0.8" }
emob-service   = { path = "crates/emob-service",   version = "0.8" }

# ── The daemon shell ────────────────────────────────────────────────────────
# Only `emob-service` and the daemons above it see these. Every domain crate
# stays sans-I/O: the clock and the socket live here so a two-year-old dispute
# can be replayed without either.
axum               = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
tokio              = { version = "1", default-features = false }
tokio-util         = { version = "0.7", default-features = false }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std", "ansi"] }
toml               = { version = "1.1", default-features = false, features = ["parse", "serde"] }

# Standard Webhooks signatures are HMAC-SHA256 over `id.timestamp.payload`,
# base64 — and the comparison has to be constant time, which is what `subtle`
# is for. A signature compared with `==` leaks where two differ, one byte of
# timing at a time.
hmac   = { version = "0.13", default-features = false }
subtle = { version = "2", default-features = false }

# Data at rest (spec 005): AES-256-GCM and the system RNG from `aws-lc-rs`,
# which `rustls` already links into every daemon through `reqwest` — so sealing a
# token adds no crate, and it is not RustCrypto, so D304's one-generation rule is
# untouched. The keyed digests stay on `hmac`/`sha2` above.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
# Station passwords use Argon2id hashes.
argon2    = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

# ── The policy an operator writes ───────────────────────────────────────────
# Only `emob-service`, behind a feature that is **off** by default, and only
# `roamd` turns it on. The same argument `doubleentry` gets one manifest for
# (D181): a partner onboarded while the node runs is the one place a policy
# engine earns its weight, and it costs a hundred and eight crates — which every
# other daemon would carry for a decision it makes from a typed value.
#
# `cedar-policy` rather than a grammar of our own: the conditions an operator
# wants to write are a *language* — a grant that starts on a date, one that ends
# on one, one that turns on a role — and inventing one is how a capability model
# becomes a policy engine nobody specified and nothing validates. Cedar has a
# schema, a validator and a proof of its own analysis.
cedar-policy = { version = "4.12", default-features = false, features = ["datetime"] }

# ── The agent plane ─────────────────────────────────────────────────────────
# Only `agentd`. The runtime whose journal is the plan of record: every effect
# performed at most once, written to an append-only hash-chained log, and read
# back on replay. `manifest` because what an agent may do has to be a file a
# reviewer sees in a diff rather than a builder call nobody reads.
agentplane = { version = "0.61", default-features = false, features = ["redb", "manifest"] }

# The elliptic-curve arithmetic, optimised even in a debug build: unoptimised,
# the 0.14 generation `ocmf` 0.2 brought made `emob-sim`'s reference day — a
# hundred stations' sessions signed and verified — take 40 s instead of 8.
# Only these crates; the workspace's own code stays debuggable.
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.p192]
opt-level = 3
[profile.dev.package.p384]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.p521]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"

# The receipt's WebAssembly verifier (`just wasm`): size over speed, because the
# module crosses a phone's mobile link and then checks two signatures.
[profile.wasm]
inherits      = "release"
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
