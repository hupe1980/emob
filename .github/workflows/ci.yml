name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  purity:
    name: Domain crates stay pure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      # A dispute about a two-year-old session is answered by replaying the
      # verification exactly as it ran. That stops being possible the moment a
      # domain crate reads a clock — so this is a build failure, not a review
      # comment.
      - run: just purity

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  guards:
    name: Workspace guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # All seven. Two of them have a half that cannot run on a clone and a
      # half that must: specs/ and concepts/ are both gitignored, so
      # `check-citations` cannot ask whether a document is *indexed* and
      # `check-concepts` cannot read the decision log — while the citation
      # *forms*, the test counts stated in the README and on the site, and the
      # shape of every table in the repository are all checked here. Each says
      # in its own output which half it skipped, because a guard that skips in
      # silence reads exactly like one that passed (D228).
      - run: cargo run -q -p xtask -- check-all

  features:
    name: Feature permutations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [emob-core, emob-eichrecht, emob-session, emob-cdr, emob-tariff]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `serde` is optional and gates real code in both crates; a build without
      # it is the one downstream users on constrained targets will attempt.
      - run: cargo check -p ${{ matrix.crate }} --no-default-features
      - run: cargo check -p ${{ matrix.crate }} --all-features

  msrv:
    name: MSRV 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      # Not `--workspace`: `emob-roam` promises 1.96 because `ocpi-kit` does,
      # and raising the shared floor would make every downstream pay for a wire
      # it does not use. `just msrv` holds the per-crate list, so the promise is
      # checked where it is made and defined in one place.
      - run: just msrv

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
