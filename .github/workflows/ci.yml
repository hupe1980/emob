name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes: every job reads the tree and fails or passes. A step that
# is compromised gets a token that can read a public repository, and no more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  purity:
    name: Domain crates stay pure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # A dispute about a two-year-old session is answered by replaying the
      # verification exactly as it ran. That stops being possible the moment a
      # domain crate reads a clock — so this is a build failure, not a review
      # comment.
      - run: just purity

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features
      # The end-to-end story, on every push: the real daemons, three stations
      # over wss:// with profile 2, a roaming partner, a seeded morning played
      # at full speed. `--check` asserts what the demo prints — seven sessions
      # billed and at the partner, the tampered one refused naming the
      # signature, the blocked card, one invoice holding exactly the billed
      # records — and fails naming the first that differs (SR-078). The TLS
      # material is `just dev-ca`'s throwaway CA, minted here by openssl.
      - run: services/csmsd/tests/fixtures/tls/mint.sh target/dev-tls
      - run: cargo run -q -p emob-cli -- demo --check
      # Every page a person reads, in light and dark at 320 and 1280 px,
      # through the accessibility tree of the Chrome the runner already has —
      # Node ≥ 22 for its built-in WebSocket, and no npm (spec 011). `CI` makes
      # a missing browser a failure rather than a skip (SR-135).
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: just a11y

  guards:
    name: Workspace guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every guard `check-all` runs, `check-actions` among them — the one that
      # refuses a movable `uses:` in this very file. Two of them have a half
      # that cannot run on a clone and a half that must: concepts/ (with the
      # corpus under concepts/reference/) is gitignored, so
      # `check-citations` cannot ask whether a document is *indexed* and
      # `check-concepts` cannot read the decision log — while the citation
      # *forms*, the test counts stated in the README and on the site, and the
      # shape of every table in the repository are all checked here. Each says
      # in its own output which half it skipped, because a guard that skips in
      # silence reads exactly like one that passed (D228).
      - run: cargo run -q -p xtask -- check-all

  features:
    name: Feature permutations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [emob-core, emob-eichrecht, emob-session, emob-cdr, emob-tariff]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `serde` is optional and gates real code in both crates; a build without
      # it is the one downstream users on constrained targets will attempt.
      - run: cargo check -p ${{ matrix.crate }} --no-default-features
      - run: cargo check -p ${{ matrix.crate }} --all-features

  msrv:
    name: MSRV 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.94
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Not `--workspace`: `emob-roam` promises 1.96 because `ocpi-kit` does,
      # and raising the shared floor would make every downstream pay for a wire
      # it does not use. `just msrv` holds the per-crate list, so the promise is
      # checked where it is made and defined in one place.
      - run: just msrv

  wasm:
    name: Receipt verifier (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # `csmsd` compiles the module in with `include_bytes!`, so the committed
      # asset is what every receipt serves. Rebuilt here from source in the same
      # pinned container `just wasm` uses locally, and a module that differs
      # from the committed one is a verifier nobody reviewed.
      - run: cp services/csmsd/assets/emob_verify.wasm "$RUNNER_TEMP/committed.wasm"
      - run: just wasm
      - run: git diff --exit-code services/csmsd/assets/emob_verify.wasm
      # When they differ, say how: what the two modules embed.
      - if: failure()
        run: |
          sha256sum "$RUNNER_TEMP/committed.wasm" services/csmsd/assets/emob_verify.wasm
          diff <(strings -n 6 "$RUNNER_TEMP/committed.wasm") <(strings -n 6 services/csmsd/assets/emob_verify.wasm) | head -60 || true

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
