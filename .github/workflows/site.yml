name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "schemas/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Only the deploy job can write to Pages; the build — which runs a downloaded
# zola over the tree — gets a read token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zola
      # The estate's and the events' JSON Schemas, at the `$id` they name
      # (spec 012): https://hupe1980.github.io/emob/schemas/…
      - run: mkdir -p site/static/schemas && cp -R schemas/. site/static/schemas/
      - run: cd site && zola build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
