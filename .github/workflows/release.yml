name: Release

# `cargo publish` cannot be undone: a version number is spent the moment it is
# accepted, and a wrong one is fixed only by burning the next. So the tag is the
# trigger, and everything before the upload is a gate.
#
# What a tag produces: the fifteen crates on crates.io (trusted publishing — no
# stored token), a GitHub release carrying every `.crate`, one CycloneDX SBOM of
# the workspace and `SHA256SUMS`, all three under a build-provenance
# attestation, and the nine daemon images plus the `emob` CLI image (what
# `just demo` runs without Rust) on ghcr.io with BuildKit provenance.
on:
  push:
    tags: ["v*"]
  # For rehearsing the whole gate against any commit. Defaults to a dry run, so
  # the manual path cannot publish by accident — and it never cuts a GitHub
  # release or pushes an image, whatever the input says.
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to crates.io (otherwise dry-run only)"
        type: boolean
        default: false

# Two releases racing each other would interleave their uploads. Never cancel a
# run that may already have uploaded a crate.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; each job is granted exactly what it writes.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny

      # A tag naming a version the manifests do not carry publishes something
      # nobody asked for, under a name nobody can reissue.
      - name: The tag names the version the workspace carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "emob-core") | .version')"
          tag="${GITHUB_REF#refs/tags/v}"
          echo "workspace version: $version · tag: v$tag"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match workspace version $version"
            exit 1
          fi

      # The same gate CI runs, re-run here rather than trusted from an earlier
      # commit: a tag can be pushed at any revision, including one CI never saw.
      - run: just ci

      # Packages every publishable crate in dependency order and builds each from
      # its own tarball — the half of the decision that is still cheap.
      - run: cargo publish --workspace --locked --dry-run

  publish:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    # Named so crates.io's trusted publishing can be scoped to it, and where a
    # required reviewer goes, so an irreversible upload can be held behind an
    # approval.
    environment:
      name: crates-io
      url: https://crates.io/crates/emob-core
    # Trusted publishing: GitHub's OIDC identity is exchanged for a crates.io
    # token that lives about thirty minutes and is revoked when the job ends.
    # There is no long-lived `CARGO_REGISTRY_TOKEN` in the repository to leak.
    # Each crate needs its trusted publisher configured once on crates.io
    # (owner `hupe1980`, repository `emob`, workflow `release.yml`, environment
    # `crates-io`); a crate without one fails at its own step, and the re-run
    # after adding it skips everything already uploaded.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Hand the short-lived token to the publish steps
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: echo "CARGO_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish emob-core
        run: |
          out=$(cargo publish -p emob-core --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-eichrecht
        run: |
          out=$(cargo publish -p emob-eichrecht --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-session
        run: |
          out=$(cargo publish -p emob-session --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-tariff
        run: |
          out=$(cargo publish -p emob-tariff --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-cdr
        run: |
          out=$(cargo publish -p emob-cdr --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-billing
        run: |
          out=$(cargo publish -p emob-billing --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-smart
        run: |
          out=$(cargo publish -p emob-smart --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-eebus
        run: |
          out=$(cargo publish -p emob-eebus --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-ocpp
        run: |
          out=$(cargo publish -p emob-ocpp --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-sim
        run: |
          out=$(cargo publish -p emob-sim --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-pnc
        run: |
          out=$(cargo publish -p emob-pnc --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-poi
        run: |
          out=$(cargo publish -p emob-poi --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-roam
        run: |
          out=$(cargo publish -p emob-roam --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-service
        run: |
          out=$(cargo publish -p emob-service --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

      - name: Publish emob-thg
        run: |
          out=$(cargo publish -p emob-thg --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit "$rc"; fi

  # The GitHub release, and what a consumer checks a release against: every
  # `.crate` as packaged here, the workspace SBOM, `SHA256SUMS` over both, and a
  # build-provenance attestation over all of it in the public transparency log
  # (`gh attestation verify emob-core-<version>.crate --repo hupe1980/emob`).
  # cargo's tarballs are reproducible, so the `.crate` attested here is the one
  # crates.io serves.
  # emobtest to PyPI by trusted publishing (spec 024): one abi3 wheel per
  # platform serves every Python >= 3.11. No sdist — the extension includes the
  # event schemas and emob's crates from outside its own directory, so it
  # builds from this repository, not from a tarball. PyPI trusts `hupe1980/emob`,
  # workflow `release.yml`, environment `pypi`.
  emobtest-wheels:
    name: emobtest wheel (${{ matrix.target }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.target }}
          args: --release --manifest-path emobtest/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emobtest-wheel-${{ matrix.target }}
          path: dist/*.whl

  emobtest-publish:
    name: Publish emobtest to PyPI
    needs: [verify, emobtest-wheels]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/emobtest/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: emobtest-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-cyclonedx

      - name: Package, SBOM, checksums
        run: |
          set -euo pipefail
          # Only the published crates: the daemons and tools are publish = false
          # and some depend on path-only crates, which `cargo package` refuses.
          cargo package --locked --no-verify $(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "-p " + .name')
          just sbom
          mkdir -p dist
          cp target/package/emob-*.crate target/sbom/*.cdx.json dist/
          (cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.cdx.json

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/* \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --verify-tag

  # The nine daemons and the `emob` CLI, from `docker-bake.hcl` — the list
  # lives there and only there. Pushed only for a tag; BuildKit attaches its SLSA provenance to each
  # image manifest. The base images are pinned by digest in the Dockerfile, so
  # what this builds on cannot move between two runs of the same tag.
  images:
    name: Images
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          push: true
          provenance: mode=max
