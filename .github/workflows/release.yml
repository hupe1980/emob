name: Release

# `cargo publish` cannot be undone: a version number is spent the moment it is
# accepted, and a wrong one is fixed only by burning the next. So the tag is the
# trigger, and everything before the upload is a gate.
on:
  push:
    tags: ["v*"]
  # For rehearsing the whole gate against any commit. Defaults to a dry run, so
  # the manual path cannot publish by accident.
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to crates.io (otherwise dry-run only)"
        type: boolean
        default: false

# Two releases racing each other would interleave their uploads. Never cancel a
# run that may already have uploaded a crate.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # A tag naming a version the manifests do not carry publishes something
      # nobody asked for, under a name nobody can reissue.
      - name: The tag names the version the workspace carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "emob-core") | .version')"
          tag="${GITHUB_REF#refs/tags/v}"
          echo "workspace version: $version · tag: v$tag"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match workspace version $version"
            exit 1
          fi

      # The same gate CI runs, re-run here rather than trusted from an earlier
      # commit: a tag can be pushed at any revision, including one CI never saw.
      - run: just ci

      # Packages every publishable crate in dependency order and builds each from
      # its own tarball — the half of the decision that is still cheap.
      - run: cargo publish --workspace --locked --dry-run

  publish:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    # Scopes the token to this environment and is where a required reviewer
    # goes, so an irreversible upload can be held behind an approval.
    environment:
      name: crates-io
      url: https://crates.io/crates/emob-core
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # One step per crate, in dependency order, because a publish is nine
      # uploads and can stop in the middle: crates.io accepts the first few,
      # something fails, and the version is now spent for those and free for the
      # rest. `cargo publish --workspace` refuses that state outright, so each
      # crate treats "already uploaded" as the upload having already happened.
      # Every other failure still stops the run.
      #
      # `cargo publish` waits for each crate to reach the index before the next
      # one resolves against it, so the order below is the dependency order.

      - name: Publish emob-core
        run: |
          out=$(cargo publish -p emob-core --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-eichrecht
        run: |
          out=$(cargo publish -p emob-eichrecht --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-session
        run: |
          out=$(cargo publish -p emob-session --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-tariff
        run: |
          out=$(cargo publish -p emob-tariff --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-cdr
        run: |
          out=$(cargo publish -p emob-cdr --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-ocpp
        run: |
          out=$(cargo publish -p emob-ocpp --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-poi
        run: |
          out=$(cargo publish -p emob-poi --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-roam
        run: |
          out=$(cargo publish -p emob-roam --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

      - name: Publish emob-sim
        run: |
          out=$(cargo publish -p emob-sim --locked 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then exit $rc; fi

  github-release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --verify-tag
